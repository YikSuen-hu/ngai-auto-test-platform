<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGAI 智能客服自动化测试系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .header { background: white; border-bottom: 1px solid #eee; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
        .logo-section { display: flex; align-items: center; gap: 16px; }
        .logo { width: 40px; height: 40px; background: linear-gradient(135deg, #5b7cff 0%, #6b5dd6 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; }
        .logo-text { font-size: 14px; font-weight: bold; color: #333; }
        .logo-sub { font-size: 10px; color: #6b7cff; letter-spacing: 2px; }
        .nav { display: flex; gap: 32px; flex: 1; margin-left: 48px; }
        .nav-item { display: flex; align-items: center; gap: 8px; color: #333; text-decoration: none; font-size: 14px; padding: 8px 0; cursor: pointer; border-bottom: 2px solid transparent; }
        .nav-item:hover { color: #6b7cff; }
        .nav-item.active { color: #6b7cff; border-bottom-color: #6b7cff; }
        .header-right { display: flex; align-items: center; gap: 24px; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: #666; }
        .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #5b7cff 0%, #6b5dd6 100%); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .main { display: grid; grid-template-columns: 1fr 320px; gap: 24px; padding: 32px; }
        .hero { background: linear-gradient(135deg, #5b7cff 0%, #7c3aed 100%); color: white; border-radius: 12px; padding: 40px; margin-bottom: 24px; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; right: -50px; top: -50px; width: 300px; height: 300px; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .hero h2 { font-size: 32px; margin-bottom: 12px; position: relative; z-index: 1; }
        .hero p { opacity: 0.9; font-size: 14px; position: relative; z-index: 1; line-height: 1.6; }
        .hero-buttons { display: flex; gap: 16px; margin-top: 24px; position: relative; z-index: 1; }
        .btn { padding: 10px 24px; border-radius: 6px; border: none; font-weight: 500; cursor: pointer; font-size: 14px; }
        .btn-primary { background: white; color: #5b7cff; }
        .btn-secondary { background: transparent; border: 2px solid white; color: white; }
        .btn:hover { opacity: 0.9; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; padding: 24px; border-radius: 8px; border: 1px solid #eee; }
        .stat-label { font-size: 12px; color: #999; margin-bottom: 8px; }
        .stat-number { font-size: 36px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .stat-change { font-size: 12px; color: #52c41a; }
        .sidebar { }
        .sidebar-card { background: white; border-radius: 8px; border: 1px solid #eee; padding: 20px; }
        .sidebar-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 16px; }
        .notification { padding: 12px 0; border-bottom: 1px solid #f0f0f0; display: flex; gap: 12px; }
        .notification:last-child { border-bottom: none; }
        .notification-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        .notification-content { flex: 1; }
        .notification-text { font-size: 12px; color: #666; line-height: 1.5; }
        .notification-time { font-size: 10px; color: #999; margin-top: 4px; }
        .warning { background: #fff3cd; }
        .info { background: #d1ecf1; }
        .success { background: #d4edda; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-section">
            <div class="logo">⚡</div>
            <div>
                <div class="logo-text">NGAI</div>
                <div class="logo-sub">AUTOMATION TEST</div>
            </div>
        </div>
        <nav class="nav">
            <a class="nav-item active" onclick="switchPage('home')">🏠 首页</a>
            <a class="nav-item" onclick="switchPage('dialogue')">💬 对话管理</a>
            <a class="nav-item" onclick="switchPage('knowledge')">📚 知识库</a>
            <a class="nav-item" onclick="switchPage('quality')">✅ 质量中心</a>
            <a class="nav-item" onclick="switchPage('report')">📊 报表分析</a>
        </nav>
        <div class="header-right">
            <button class="icon-btn">🔔</button>
            <div class="user-info">
                <div class="avatar">张</div>
                <div>
                    <div style="font-weight: 500;">张工程师</div>
                    <div style="font-size: 12px; color: #999;">高级测试工程师</div>
                </div>
            </div>
            <button class="icon-btn">⌄</button>
        </div>
    </div>

    <div class="main">
        <div>
            <div class="hero">
                <h2 id="heroTitle">欢迎回来，张工程师</h2>
                <p id="heroText">智能自服自动化测试平台 V1.0 运行正常。当前有 3 个待优化项目，1 个产重的知识库关键要处理。</p>
                <div class="hero-buttons">
                    <button class="btn btn-primary" onclick="switchPage('quality')">▶ 开始快速测试</button>
                    <button class="btn btn-secondary">查看系统健康度</button>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">活跃场景数</div>
                    <div class="stat-number">127</div>
                    <div class="stat-change">▲ 12% 较上周</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">知识库覆盖率</div>
                    <div class="stat-number">92.4%</div>
                    <div class="stat-change">目标设定: 95.0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">平均响应延迟</div>
                    <div class="stat-number">1.2s</div>
                    <div class="stat-change">高优化 CPU 占用</div>
                </div>
            </div>

            <div id="content"></div>
        </div>

        <div class="sidebar">
            <div class="sidebar-card">
                <div class="sidebar-title">系统通知</div>
                <div class="notification warning">
                    <div class="notification-icon" style="background: #ff7875;">⚠</div>
                    <div class="notification-content">
                        <div class="notification-text">如印象重新: 手机配件跳槽版变化日头效</div>
                        <div class="notification-time">10秒前</div>
                    </div>
                </div>
                <div class="notification info">
                    <div class="notification-icon" style="background: #1890ff;">ℹ</div>
                    <div class="notification-content">
                        <div class="notification-text">整点完成: 口罪查询改行回回回测试, 100% 适过</div>
                        <div class="notification-time">1小时前</div>
                    </div>
                </div>
                <div class="notification success">
                    <div class="notification-icon" style="background: #52c41a;">✓</div>
                    <div class="notification-content">
                        <div class="notification-text">资源预览: 节点「对话」服」改份表现 85%</div>
                        <div class="notification-time">2小时前</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const pages = {
            home: {
                heroTitle: '欢迎回来，张工程师',
                heroText: '智能自服自动化测试平台 V1.0 运行正常。当前有 3 个待优化项目，1 个产重的知识库关键要处理。',
                content: ''
            },
            dialogue: {
                heroTitle: '对话管理',
                heroText: '管理和测试您的对话流程，优化客户体验',
                content: '<div style="background: white; padding: 24px; border-radius: 8px; border: 1px solid #eee;"><h3 style="margin-bottom: 16px;">对话测试列表</h3><p>暂无数据</p></div>'
            },
            knowledge: {
                heroTitle: '知识库',
                heroText: '管理系统的知识条目和语义库',
                content: '<div style="background: white; padding: 24px; border-radius: 8px; border: 1px solid #eee;"><h3 style="margin-bottom: 16px;">知识库条目</h3><p>总计 2.5K 条条目，覆盖率 92.4%</p></div>'
            },
            quality: {
                heroTitle: '质量中心',
                heroText: '监控测试质量，管理缺陷和优化方案',
                content: '<div style="background: white; padding: 24px; border-radius: 8px; border: 1px solid #eee;"><h3 style="margin-bottom: 16px;">质量指标</h3><p>通过率: 92.4% | 缺陷数: 12 | 覆盖率: 92.4%</p></div>'
            },
            report: {
                heroTitle: '报表分析',
                heroText: '查看测试报告和数据分析',
                content: '<div style="background: white; padding: 24px; border-radius: 8px; border: 1px solid #eee;"><h3 style="margin-bottom: 16px;">本周报表</h3><p>测试用例: 127 | 通过: 117 | 失败: 10</p></div>'
            }
        };

        function switchPage(page) {
            const data = pages[page];
            if (!data) return;
            
            document.getElementById('heroTitle').textContent = data.heroTitle;
            document.getElementById('heroText').textContent = data.heroText;
            document.getElementById('content').innerHTML = data.content;
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
